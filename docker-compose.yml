# OmniAgent 控制台一键容器化。
#
# 说明：这里【只】编排控制台本体。7 个微服务（8000/8001/8002/8501/8510/8765/7860）
# 是各自独立的仓库，不在本仓库内 —— 想让面板显示在线，有两种做法：
#   1) 微服务跑在宿主机上：用下面的 extra_hosts（host.docker.internal）让容器访问宿主端口；
#   2) 微服务也容器化：把它们加进同一个 compose 网络，并把 services.yaml 的 url 改成服务名。
services:
  console:
    build: .
    image: omniagent-console:2.2
    container_name: omni-console
    ports:
      - "${OMNI_PORT:-8888}:8888"
    environment:
      OMNI_PORT: 8888
      # 容器里必须 bind 0.0.0.0，否则上面的端口发布从宿主机打不通（容器 healthcheck
      # 却会通过，变成「健康但访问不了」的静默失败）
      OMNI_HOST: 0.0.0.0
      # 容器内的 127.0.0.1 是容器自己，探不到宿主机上的微服务 —— 必须指向宿主机
      OMNI_PROBE_HOST: host.docker.internal
      TZ: Asia/Shanghai
    volumes:
      # 历史曲线数据（SQLite）持久化。
      # 用【命名卷】而不是 ./data 绑定挂载：镜像里以非 root（omni）运行，
      # 而绑定挂载会沿用宿主机目录的属主 —— 宿主机上 data/ 不存在时 Docker 以 root
      # 创建，容器内 uid 1000 就写不进 SQLite。命名卷由 Docker 管理属主，不会踩这个坑。
      - omni-data:/app/data
    extra_hosts:
      # 让 OMNI_PROBE_HOST=host.docker.internal 能解析到宿主机（Linux 需要显式配，Docker Desktop 自带）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8888/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  omni-data:
