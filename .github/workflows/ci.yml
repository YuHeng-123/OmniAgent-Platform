name: CI

# 每次推送到 main / 每个 PR 都跑一遍：
#   1. pytest 断言测试（拓扑配置、事件总线纯函数、前端本地化、接口契约）
#   2. 全链路离线自检（同进程真起 API + 静态站，打 11 组真实 HTTP）
#   3. 事件总线「差异驱动」专项验证
#   4. 重跑 build_docs.py 并断言 docs/ 与源码一致（防止线上演示版悄悄过期）
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check . || (echo "::error::代码格式不符合 ruff-format，请在本地跑 ruff format ." && exit 1)

      - name: Run pytest
        run: python -m pytest -q

      # 纯静态分析：抓「按钮点了没反应」这类死接线（onclick 无实现 / OmniAPI 无方法 / id 悬空）
      - name: Frontend wiring audit (static)
        run: python tools/audit_frontend_wiring.py evidence/frontend-wiring.txt

      - name: Full offline selftest (real HTTP, 11 groups)
        run: python selftest_omni.py evidence/selftest-omni.txt

      - name: Verify event bus is diff-driven
        run: python verify_event_bus.py evidence/event-bus-diff.txt

      - name: Rebuild docs and assert no drift
        run: |
          python build_docs.py
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ 与源码不同步 —— 请在本地重跑 build_docs.py 并提交结果"
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ 与源码一致 ✅"

      - name: Service readiness check (informational)
        continue-on-error: true
        run: python check_services.py

      # 静态对账：Dockerfile 的 COPY 清单必须覆盖 server.py 的所有本地 import。
      # 2.8.0 曾漏掉 core/ 与 routers/ —— 镜像能 build、容器一启动就 ModuleNotFoundError。
      - name: Image file set matches Dockerfile COPY list
        run: python tools/check_image_files.py

      # 本机没有 Docker CLI 时，用 hadolint 兜住镜像层问题（DL 系列规则）
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Docker image builds
        run: docker build -t omniagent-console:ci .

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
          if-no-files-found: warn
